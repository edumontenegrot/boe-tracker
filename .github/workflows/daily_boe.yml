name: Daily BOE Tracker

on:
  schedule:
    # 08:00 UTC = 09:00 Madrid (invierno) / 10:00 Madrid (verano)
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Fecha a procesar (YYYY-MM-DD). Vacío = hoy."
        required: false
        default: ""
      bulletins:
        description: "Boletines (separados por espacios, ej: 'BOE BOCM'). Vacío = todos."
        required: false
        default: ""

permissions:
  contents: write   # needed to push to the data branch

jobs:
  download:
    name: Download BOE/CCAA bulletins
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can push to data branch

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build CLI arguments
        id: args
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          if [ -n "${{ github.event.inputs.bulletins }}" ]; then
            ARGS="$ARGS --bulletins ${{ github.event.inputs.bulletins }}"
          fi
          echo "cli_args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Run BOE Tracker
        run: python main.py ${{ steps.args.outputs.cli_args }}
        continue-on-error: true   # individual bulletin failures don't abort the job

      - name: Commit and push data to 'data' branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Switch to (or create) the data branch without disturbing main
          git fetch origin data 2>/dev/null || true
          git checkout -B data origin/data 2>/dev/null || git checkout -B data

          # Copy the downloaded output/ from the workspace into the data branch
          # (git checkout switched branches, so we need the files from main's run)
          git checkout ${{ github.sha }} -- output/ 2>/dev/null || true

          git add output/
          git diff --cached --quiet && echo "Nothing new to commit." && exit 0

          DATE_LABEL=$(date -u +%Y-%m-%d)
          git commit -m "data: BOE/CCAA update ${DATE_LABEL} [skip ci]"
          git push origin data
