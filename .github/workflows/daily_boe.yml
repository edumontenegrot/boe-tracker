name: Daily BOE Tracker

on:
  schedule:
    # 20:00 UTC = 21:00 Madrid (invierno) / 22:00 Madrid (verano)
    - cron: "0 20 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Fecha a procesar (YYYY-MM-DD). Vacío = hoy."
        required: false
        default: ""
      bulletins:
        description: "Boletines (separados por espacios, ej: 'BOE BOCM'). Vacío = todos."
        required: false
        default: ""

permissions:
  contents: write   # needed to push to the data branch

jobs:
  download:
    name: Download BOE/CCAA bulletins
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can create/push data branch

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build CLI arguments
        id: args
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          if [ -n "${{ github.event.inputs.bulletins }}" ]; then
            ARGS="$ARGS --bulletins ${{ github.event.inputs.bulletins }}"
          fi
          echo "cli_args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Run BOE Tracker
        run: python main.py ${{ steps.args.outputs.cli_args }}
        continue-on-error: true   # bulletin failures don't abort the job

      - name: Commit and push data to 'data' branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          WORK_DIR=/tmp/data-branch

          # Set up a worktree pointing at the data branch (create it if missing).
          # git worktree add --orphan requires git ≥2.37; ubuntu-latest ships 2.34,
          # so we create the initial empty commit manually using commit-tree instead.
          if git ls-remote --exit-code origin data > /dev/null 2>&1; then
            git fetch origin data
            git worktree add "$WORK_DIR" origin/data -b data
          else
            # First run: build an empty orphan commit without --orphan flag
            EMPTY_TREE=$(git hash-object -t tree /dev/null)
            INIT_COMMIT=$(echo "init: create data branch [skip ci]" | git commit-tree "$EMPTY_TREE")
            git branch data "$INIT_COMMIT"
            git worktree add "$WORK_DIR" data
          fi

          # Copy downloaded files into the worktree (no .gitignore conflicts here)
          if [ -d output ]; then
            cp -r output/. "$WORK_DIR/"
          fi

          cd "$WORK_DIR"
          git add .
          if git diff --cached --quiet; then
            echo "Nothing new to commit — no bulletins published today."
            exit 0
          fi

          DATE_LABEL=$(date -u +%Y-%m-%d)
          git commit -m "data: BOE/CCAA update ${DATE_LABEL} [skip ci]"
          git push origin HEAD:data
